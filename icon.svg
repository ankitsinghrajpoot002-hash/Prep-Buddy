<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="iosBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="55%" stop-color="#3B62FF"/>
      <stop offset="100%" stop-color="#5E5CE6"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D1E4FF"/>
    </linearGradient>
  </defs>
  <!-- iOS Squircle Base -->
  <rect width="512" height="512" rx="115" fill="url(#iosBg)"/>
  <!-- Subtle Top Glass Highlight -->
  <rect x="20" y="20" width="472" height="236" rx="96" fill="#FFFFFF" opacity="0.08"/>
  <!-- Outer Focus Activity Ring -->
  <circle cx="256" cy="256" r="142" fill="none" stroke="#FFFFFF" stroke-width="26" opacity="0.22"/>
  <circle cx="256" cy="256" r="142" fill="none" stroke="url(#ringGrad)" stroke-width="26"
          stroke-dasharray="680 892" stroke-linecap="round" transform="rotate(-90 256 256)"/>
  <!-- Minimal Clock / Focus Needle -->
  <path d="M256 172 V256 L316 292" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Center Anchor Dot -->
  <circle cx="256" cy="256" r="16" fill="#FFFFFF"/>
</svg>
