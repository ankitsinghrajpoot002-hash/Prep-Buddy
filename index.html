</style></head><body>
<div id="spl"><svg width="104" height="104" viewBox="0 0 96 96"><circle cx="48" cy="48" r="36" fill="none" stroke="#1D8CF8" stroke-width="8" stroke-linecap="round" stroke-dasharray="170 60" transform="rotate(-90 48 48)"/><path d="M33 49l10 10 20-23" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg><h1 style="margin:0">Prep Buddy</h1><small>Created by Kalua X</small></div>
<div id="app"><main>
<section id="t0" class="tab on"><h1>Focus</h1>

</main>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],p2=n=>String(n).padStart(2,'0');
const day=(d=new Date())=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const dd=n=>{const d=new Date();d.setDate(d.getDate()+n);return day(d)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');

const fmt=s=>{const h=s/3600|0;return(h?h+':':'')+p2(s%3600/60|0)+':'+p2(s%60)};
const ST=['Not started','In progress','Completed','Revised 1x','Revised 2x','Revised 3x'];
const RK=[[0,'Beginner','🌱'],[25,'Learner','📘'],[100,'Practitioner','🧭'],[250,'Challenger','⚡'],[500,'Ace','💎'],[1000,'Topper','👑']];
const TH=[['#1D8CF8','Electric',1],['#00E676','Emerald',5],['#FFAB00','Amber',10],['#FF3D00','Crimson',15],['#00E5FF','Arctic',20]];

let S={name:'',goal:4,acc:'#1D8CF8',exp:0,subj:[],ses:[],pz:{}},db,R=null,M={m:'up',t:0,br:0},ty='Theory',wl,hid=0,AC,nz,lock=0,ak,tt;
const W=new Worker('timer.worker.js');W.onmessage=e=>tick(e.data);
/* storage: IndexedDB + localStorage mirror */
const kv=(m,v)=>new Promise((ok,no)=>{const s=db.transaction('kv',m).objectStore('kv'),q=m==='readonly'?s.get('s'):s.put(v,'s');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
const save=()=>{try{localStorage.setItem('pb_mirror',JSON.stringify({n:S.name,g:S.goal,a:S.acc,e:S.exp}))}catch(e){}kv('readwrite',S).catch(()=>{})};
/* helpers */
const dayMin=k=>S.ses.reduce((a,s)=>a+(s.k===k&&s.ok?s.d:0),0)/60;
const totH=()=>S.ses.reduce((a,s)=>a+(s.ok?s.d:0),0)/3600;
const rankOf=h=>[...RK].reverse().find(r=>h>=r[0]);
function yMin(){const y=new Date(Date.now()-864e5),k=day(y);return S.ses.reduce((a,s)=>a+(s.k===k&&s.ok&&s.ts<=y.getTime()?s.d:0),0)/60}
function streak(){let n=0,d=new Date();if(dayMin(day(d))/60<S.goal)d.setDate(d.getDate()-1);while(n<9999&&dayMin(day(d))/60>=S.goal){n++;d.setDate(d.getDate()-1)}return n}
function toast(m){const e=$('#ts');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}
function sheet(h,l){lock=l;$('#spb').innerHTML=h;$('#sh').classList.add('on')}
const closeSheet=()=>$('#sh').classList.remove('on');
$('#sh').onclick=e=>{if(e.target.id==='sh'&&!lock)closeSheet()};
function ask(t,cb){ak=cb;sheet(`<h1>${t}</h1><input id="ai" autocomplete="off"><button class="btn" onclick="askOk()">Save</button>`);setTimeout(()=>$('#ai').focus(),350)}
function askOk(){const v=$('#ai').value.trim();closeSheet();if(v)ak(v)}
function pick(b){[...b.parentNode.children].forEach(x=>x.classList.toggle('on',x===b));vib(10)}
function setM(b,m,t,br){pick(b);M={m,t:t*60,br}}
function setT(b,v){pick(b);ty=v}
function dlist(){const s=S.subj.find(x=>x.n===$('#fs').value);$('#tl').innerHTML=s?s.tp.map(t=>`<option value="${esc(t.n)}">`).join(''):''}
function go(i){$$('.tab').forEach((t,j)=>t.classList.toggle('on',j===i));$$('nav button').forEach((b,j)=>b.classList.toggle('on',j===i));$('main').scrollTop=0;vib(8);render()}
/* audio */
const ac=()=>AC||(AC=new(window.AudioContext||window.webkitAudioContext)());
function chime(){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.2,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+1.2);o.start();o.stop(c.currentTime+1.2)}catch(e){}}
function sound(k,b){b&&pick(b);if(nz){try{nz.stop()}catch(e){}nz=0}if(k==='off')return;
 try{const c=ac();c.resume();const n=c.sampleRate*2,bf=c.createBuffer(1,n,c.sampleRate),d=bf.getChannelData(0);let l=0;
 for(let i=0;i<n;i++){const w=Math.random()*2-1;if(k==='brown'){l=(l+.02*w)/1.02;d[i]=l*3.5}else d[i]=w*.5}
 const s=c.createBufferSource(),g=c.createGain();s.buffer=bf;s.loop=true;g.gain.value=k==='rain'?1.2:.35;let o=s;
 if(k==='rain'){o=c.createBiquadFilter();o.type='bandpass';o.frequency.value=1800;o.Q.value=.4;s.connect(o)}
 o.connect(g);g.connect(c.destination);s.start();nz=s}catch(e){}}
/* focus engine */
async function wake(){try{if(R&&!wl&&navigator.wakeLock){wl=await navigator.wakeLock.request('screen');wl.onrelease=()=>wl=null}}catch(e){}}
function start(){if(R)return;
 R={m:M.m,t:M.t,br:M.br,sub:$('#fs').value||'General',top:$('#ft').value.trim(),ty,hard:$('#hc').checked,t0:Date.now(),el:0,l:-1};
 try{ac().resume()}catch(e){}
 W.postMessage({c:'start'});document.body.classList.add('run');
 $('#pb').style.display=R.hard?'none':'';$('#pb').textContent='Pause';$('#sb').textContent=(R.top||R.sub)+' ('+R.ty+')';
 vib(40);wake();if(R.hard&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});tick(0)}
function tick(el){if(!R||el===R.l)return;R.l=el;R.el=el;let t;
 if(R.m==='down'){if(el<R.t)t=fmt(R.t-el);else{if(!R.over){R.over=1;chime();vib([300,120,300]);$('#sb').textContent='Goal reached, flowtime on'}t='+'+fmt(el-R.t)}}else t=fmt(el);
 $('#clk').textContent=t;const tm=dayMin(day())+el/60,ym=yMin(),df=Math.round(tm-ym);
 $('#gb').style.width=Math.min(100,ym?tm/ym*100:100)+'%';$('#gb').style.background=df>=0?'var(--g)':'var(--w)';
 $('#gt').innerHTML='<small>Ghost: '+(df>=0?'+':'')+df+' min vs yesterday'+(R.m==='up'?', break earned '+(el/300|0)+' min':'')+'</small>'}
function pause(){if(!R||R.hard)return;
 if(R.pz){R.pz=0;W.postMessage({c:'resume'});$('#pb').textContent='Pause';return}
 R.pz=1;W.postMessage({c:'pause'});$('#pb').textContent='Resume';
 sheet('<h1>Why did you pause?</h1>'+['Water / Restroom','Sleepiness','Phone notification','Boredom / Fatigue','External disturbance'].map(x=>`<button class="btn o" onclick="why(this.textContent)">${x}</button>`).join(''))}
const why=r=>{S.pz[r]=(S.pz[r]||0)+1;save();closeSheet()};
function end(){if(!R)return;W.postMessage({c:'pause'});if(R.el<60){toast('Under 1 minute, not counted');return reset()}
 sheet('<h1>How focused were you?</h1><div class="row">'+[1,2,3,4,5].map(n=>`<button class="btn o" onclick="fin(${n})">${n}★</button>`).join('')+'</div><br><button class="btn o" onclick="closeSheet();reset()">Discard session</button>',1)}
function fin(q){const r=R,k=day(),m=r.el/60|0;let e=Math.round(m*10*(r.hard?1.5:1));
 if(!S.ses.some(s=>s.k===k)&&new Date(r.t0).getHours()<6)e+=200;
 S.ses.push({k,ts:Date.now(),d:r.el,sub:r.sub,top:r.top,ty:r.ty,q,ok:1,hr:r.hard?1:0,e});S.exp+=e;
 const sb=S.subj.find(x=>x.n===r.sub),tp=sb&&sb.tp.find(x=>x.n.toLowerCase()===r.top.toLowerCase());if(tp){tp.t+=r.el/60;if(!tp.s)tp.s=1}
 save();closeSheet();reset();render();vib([80,60,80,60,300]);toast('+'+e+' EXP')}
function kill(){const r=R;S.ses.push({k:day(),ts:Date.now(),d:r.el,sub:r.sub,top:r.top,ty:r.ty,q:0,ok:0,hr:1,e:-300});S.exp=Math.max(0,S.exp-300);save();reset();render();vib([500,150,500]);
 sheet('<h1 style="color:var(--r)">Session failed</h1><p class="mut" style="margin-bottom:14px">You left focus mode for more than 5 seconds. Your plant withered and 300 EXP was deducted.</p><button class="btn" onclick="closeSheet()">Back to focus</button>',1)}
function reset(){R=null;W.postMessage({c:'stop'});document.body.classList.remove('run');$('#clk').textContent='00:00';$('#sb').textContent='Ready when you are';$('#gb').style.width='0';$('#gt').innerHTML="<small>Ghost: race yesterday's pace</small>";
 if(wl){wl.release().catch(()=>{});wl=null}if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){if(R&&R.hard)hid=Date.now();return}
 if(R){wake();if(R.hard&&hid){const g=Date.now()-hid;if(g>5000)kill();else{vib(120);toast('Stay in focus mode')}}}hid=0});
/* syllabus */
const F=(s,t)=>{const a=S.subj.find(x=>x.id===s);return[a,a&&a.tp.find(x=>x.id===t)]};
const addS=()=>ask('New subject',v=>{S.subj.push({id:uid(),n:v,tp:[]});save();render()});
const addT=s=>ask('New topic',v=>{F(s)[0].tp.push({id:uid(),n:v,s:0,t:0,rv:[]});save();render()});
function cyc(s,t){const x=F(s,t)[1];x.s=(x.s+1)%6;if(x.s===2)x.rv=[1,3,7,21].map(n=>dd(n));if(!x.s)x.rv=[];save();render();vib(15)}
function rev(s,t){const x=F(s,t)[1],td=day();x.rv=x.rv.filter(d=>d>td);x.s=x.s<3?3:Math.min(5,x.s+1);save();render();vib([30,40,30])}
/* render */
function render(){rF();rS();rN();rA();rP()}
function rF(){const sel=$('#fs'),cur=sel.value;sel.innerHTML=S.subj.length?S.subj.map(s=>`<option>${esc(s.n)}</option>`).join(''):'<option>General</option>';
 if([...sel.options].some(o=>o.value===cur))sel.value=cur;dlist();
 $('#log').innerHTML=S.ses.filter(s=>s.k===day()).reverse().map(s=>`<div class="r2"><span>${s.ok?'✅':'🥀'} ${esc(s.top||s.sub)}<br><small>${esc(s.sub)}, ${s.ty}${s.ok?', '+s.q+'★':''}</small></span><b>${s.ok?Math.round(s.d/60)+' min':'-300 EXP'}</b></div>`).join('')||'<p class="mut">No sessions yet. Start your first one.</p>'}
function rS(){const td=day(),due=[];S.subj.forEach(s=>s.tp.forEach(t=>{if(t.rv.length&&t.rv[0]<=td)due.push([s,t])}));
 $('#t1').innerHTML='<h1>Syllabus</h1><div class="card"><h2>Revision radar: '+due.length+' due today</h2>'+(due.map(([s,t])=>`<div class="r2"><span>${esc(t.n)}<br><small>${esc(s.n)}</small></span><button class="ch on" onclick="rev('${s.id}','${t.id}')">Mark revised</button></div>`).join('')||'<p class="mut">Nothing due. Mark a topic Completed to schedule reviews on day 1, 3, 7 and 21.</p>')+'</div>'+
 S.subj.map(s=>`<div class="card"><div class="r2" style="border:0;padding-top:0"><b>${esc(s.n)}</b><button class="ch" onclick="addT('${s.id}')">+ Topic</button></div>${s.tp.map(t=>`<div class="r2"><span>${esc(t.n)}<br><small>${Math.round(t.t)} min studied</small></span><button class="ch on" onclick="cyc('${s.id}','${t.id}')">${ST[t.s]}</button></div>`).join('')}</div>`).join('')+'<button class="btn o" onclick="addS()">+ Add subject</button>'}
function rN(){const st=new Date();st.setDate(st.getDate()-364);let hm='';for(let i=0;i<st.getDay();i++)hm+='<i style="visibility:hidden"></i>';
 for(let i=0;i<365;i++){const d=new Date(st);d.setDate(st.getDate()+i);const h=dayMin(day(d))/60;hm+=`<i class="l${h<=0?0:h<1?1:h<2?2:h<4?3:4}" data-t="${day(d)}: ${h.toFixed(1)} h"></i>`}
 const L=[...Array(7)].map((_,i)=>[dd(i-6),dayMin(dd(i-6))/60]),mx=Math.max(S.goal,...L.map(x=>x[1])),hrs=Array(24).fill(0);
 S.ses.forEach(s=>{if(s.ok)hrs[new Date(s.ts-s.d*1e3).getHours()]+=s.d/60});const hx=Math.max(...hrs,1),pk=hrs.indexOf(Math.max(...hrs));
